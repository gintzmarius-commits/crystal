name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while read -r l; do echo "::error::$l"; done

      - name: Publish APK as a release (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WaveIsland.apk
          echo $((100 + GITHUB_RUN_NUMBER)) > version.txt
          gh release delete latest -y --cleanup-tag || true
          gh release create latest WaveIsland.apk version.txt \
            --title "Derniere version" --notes "Telecharge WaveIsland.apk puis installe-le."

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: WaveIsland.apk

  emulator-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator_test.sh

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la shots || exit 0
          ls -la shots | while read -r l; do echo "::notice::$l"; done
          find shots -type f -size 0 -delete
          gh release delete tests -y --cleanup-tag || true
          gh release create tests shots/* --prerelease \
            --title "Captures de test" --notes "Captures automatiques sur emulateur Android 14."
