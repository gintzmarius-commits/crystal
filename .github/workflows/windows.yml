name: Windows

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compile glass shaders
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
                 Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          Write-Host "fxc: $($fxc.FullName)"
          & $fxc.FullName /nologo /T ps_3_0 /E main /O3 /D FULL=1 /Fo "windows\WaveIsland\LiquidDrop3.ps" "windows\WaveIsland\LiquidDrop.hlsl"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::LiquidDrop3 non compile"; exit 1 }
          foreach ($name in 'Glass', 'LiquidDrop') {
            & $fxc.FullName /nologo /T ps_2_0 /E main /O3 /Fo "windows\WaveIsland\$name.ps" "windows\WaveIsland\$name.hlsl"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::$name trop long pour ps_2_0, compilation en ps_3_0"
              & $fxc.FullName /nologo /T ps_3_0 /E main /O3 /Fo "windows\WaveIsland\$name.ps" "windows\WaveIsland\$name.hlsl"
              if ($LASTEXITCODE -ne 0) { Write-Host "::error::$name non compile"; exit 1 }
            }
          }

      - name: Build WaveIsland.exe
        shell: pwsh
        run: |
          dotnet publish windows\WaveIsland\WaveIsland.csproj -c Release -o out "-p:Version=3.0.${{ github.run_number }}" 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': error ' | Select-Object -ExpandProperty Line -Unique | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Get-Item out\WaveIsland.exe | Format-List Name, Length

      - name: Test (demo + screenshots)
        id: demo
        continue-on-error: true
        shell: powershell
        env:
          WAVE_SHOTS: ${{ github.workspace }}\shots
          WAVE_DOWNLOADS: ${{ github.workspace }}\dl
        run: |
          New-Item -ItemType Directory -Force shots, dl | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png")
            $g.Dispose(); $bmp.Dispose()
          }
          $p = Start-Process out\WaveIsland.exe -ArgumentList '--demo' -PassThru
          for ($i = 0; $i -lt 120; $i++) { if (Test-Path shots\pret-pour-toast.txt) { break }; Start-Sleep -Milliseconds 500 }
          Shot "00-ecran"
          try {
            [Windows.UI.Notifications.ToastNotificationManager, Windows.UI.Notifications, ContentType = WindowsRuntime] | Out-Null
            $xml = [Windows.UI.Notifications.ToastNotificationManager]::GetTemplateContent([Windows.UI.Notifications.ToastTemplateType]::ToastText02)
            $t = $xml.GetElementsByTagName('text')
            $t.Item(0).AppendChild($xml.CreateTextNode('Paul')) | Out-Null
            $t.Item(1).AppendChild($xml.CreateTextNode('Vraie notification Windows de test')) | Out-Null
            $aumid = '{1AC14E77-02E7-4E5D-B744-2EB1AE5198B7}\WindowsPowerShell\v1.0\powershell.exe'
            [Windows.UI.Notifications.ToastNotificationManager]::CreateToastNotifier($aumid).Show([Windows.UI.Notifications.ToastNotification]::new($xml))
            Write-Host "Toast envoye"
          } catch { Write-Host "Toast impossible: $_" }
          if (-not $p.WaitForExit(180000)) { Write-Host "::warning::La demo ne s'est pas terminee"; Shot "99-bloque"; $p.Kill() }
          $log = "$env:APPDATA\WaveIsland\journal.txt"
          if (Test-Path $log) { Copy-Item $log shots\journal.txt; Get-Content $log }
          $crash = "$env:APPDATA\WaveIsland\dernier-plantage.txt"
          if (Test-Path $crash) { Copy-Item $crash shots\plantage.txt; Write-Host "::error::Plantage"; Get-Content $crash }
          if (-not (Select-String -Path $log -Pattern 'DEMO OK' -Quiet)) { Write-Host "::error::Demo incomplete"; exit 1 }

      - name: Test (installation + desinstallation)
        id: install
        continue-on-error: true
        shell: powershell
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\Wave Island"
          $p = Start-Process out\WaveIsland.exe -ArgumentList '--install-test' -PassThru -Wait
          $ok = (Test-Path "$dir\WaveIsland.exe") -and (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Wave Island.lnk") -and (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\WaveIsland')
          Write-Host "Installee : $ok"
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\WaveIsland' -ErrorAction SilentlyContinue | Select-Object DisplayName, DisplayVersion, UninstallString | Format-List
          if (-not $ok) { Write-Host "::error::Installation incomplete"; exit 1 }
          Start-Process "$dir\WaveIsland.exe" -ArgumentList '--uninstall','--quiet' -Wait
          Start-Sleep -Seconds 6
          $gone = -not (Test-Path "$dir\WaveIsland.exe") -and -not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\WaveIsland')
          Write-Host "Desinstallee : $gone"
          if (-not $gone) { Write-Host "::error::Desinstallation incomplete"; exit 1 }

      - name: Publish screenshots
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path shots)) { exit 0 }
          gh release delete windows-tests -y --cleanup-tag 2>$null
          $files = Get-ChildItem shots -File | ForEach-Object { $_.FullName }
          gh release create windows-tests $files --prerelease --latest=false --title "Windows tests ${{ github.run_number }}" --notes "Captures du test automatique"

      - name: Publish WaveIsland.exe
        if: steps.demo.outcome == 'success' && steps.install.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "${{ github.run_number }}" | Out-File -Encoding ascii -NoNewline version.txt
          Copy-Item out\WaveIsland.exe WaveIsland.exe
          gh release delete windows -y --cleanup-tag 2>$null
          gh release create windows WaveIsland.exe version.txt --prerelease --latest=false --title "Wave Island pour Windows 3.0.${{ github.run_number }}" --notes "Telecharge WaveIsland.exe et lance-le."
